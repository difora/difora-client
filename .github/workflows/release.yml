name: Publish CLI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'difora/difora-client' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm publish --provenance --access public
