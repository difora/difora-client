name: GitHub release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'difora/difora-client' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Prepare package, checksum and release notes
        if: matrix.node == 24
        run: node scripts/prepare-release.mjs "$RUNNER_TEMP/release"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: cli-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: cli-release
          path: ${{ runner.temp }}/release/
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: difora/difora-client
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo 'This release is already published. Published assets must not be overwritten.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Difora CLI ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "difora-${RELEASE_TAG#v}.tgz" SHA256SUMS --clobber
          prerelease=false
          latest=true
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" \
            --latest="$latest" --title "Difora CLI ${RELEASE_TAG#v}" --notes-file release-notes.md
